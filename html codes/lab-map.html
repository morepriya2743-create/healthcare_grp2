<!DOCTYPE html>
<html>

<head>
    <title>Interactive Urine Test Strip</title>
</head>

<body bgcolor="AliceBlue">

    <h1 align="center">LifeCare Clinical Laboratory</h1>
    <hr>

    <h2 align="center">Interactive Urine Test Strip</h2>

    <p align="center">
        Click on a test pad to know its function.
    </p>

    <center>
        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/6/68/Chemstrip1.jpg/250px-Chemstrip1.jpg"
             alt="Urine Test Strip"
             title="Interactive Urine Test Strip"
             width="550"
             height="450"
             border="2"
             usemap="#stripmap">
    </center>

    <map name="stripmap">

        <area shape="rect"
              coords="50,20,200,90"
              href="glucose.html"
              alt="Glucose Pad"
              title="Glucose Pad">

        <area shape="rect"
              coords="50,100,200,170"
              href="protein.html"
              alt="Protein Pad"
              title="Protein Pad">

        <area shape="rect"
              coords="50,180,200,250"
              href="bloodpad.html"
              alt="Blood Pad"
              title="Blood Pad">

        <area shape="rect"
              coords="50,260,200,330"
              href="ketone.html"
              alt="Ketone Pad"
              title="Ketone Pad">

        <area shape="rect"
              coords="50,340,200,410"
              href="ph.html"
              alt="pH Pad"
              title="pH Pad">

    </map>

    <hr>

    <table border="1" align="center" cellpadding="8">

        <tr bgcolor="LightGray">
            <th>Pad</th>
            <th>Purpose</th>
        </tr>

        <tr>
            <td>Glucose</td>
            <td>Checks glucose level in urine.</td>
        </tr>

        <tr>
            <td>Protein</td>
            <td>Detects protein in urine.</td>
        </tr>

        <tr>
            <td>Blood</td>
            <td>Detects blood in urine.</td>
        </tr>

        <tr>
            <td>Ketone</td>
            <td>Checks ketone bodies.</td>
        </tr>

        <tr>
            <td>pH</td>
            <td>Measures urine acidity.</td>
        </tr>

    </table>

</body>

</html>
